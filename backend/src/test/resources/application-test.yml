spring:
  datasource:
    url: jdbc:h2:mem:gotham;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            scope:
              - openid
              - profile
              - email

jwt:
  secret: test-secret-value-for-local-validation
  expiration: 86400000

cors:
  allowed-origins:
    - http://localhost:5173
    - http://127.0.0.1:5173

app:
  frontend-url: http://localhost:5173
  auth:
    refresh-token-expiration: 604800000
    cookie:
      name: gotham_refresh_token
      secure: false
      same-site: Lax
      path: /api/auth
      max-age-seconds: 604800

